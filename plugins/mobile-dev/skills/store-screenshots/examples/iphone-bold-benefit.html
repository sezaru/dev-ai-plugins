<!-- EXAMPLE (not a template). Archetype: BOLD BENEFIT — big verb-led headline up top, the
     device angled below, one floating proof-stat. 1290x2796 (iPhone 6.7"). Every value here
     is bespoke to this fictional app's indigo brand; design yours to match the real app. -->
<style>
  .stage{background:radial-gradient(1400px 1000px at 80% -8%,#4f46e5 0%,transparent 55%),

         font-family:var(--font-body);color:#fff;}
  .kick{position:absolute;top:150px;left:0;right:0;text-align:center;
        font-weight:700;letter-spacing:8px;font-size:38px;color:#c7d2fe;text-transform:uppercase;}

        letter-spacing:-6px;}
  .head em{font-style:normal;background:linear-gradient(90deg,#818cf8,#c4b5fd);
           -webkit-background-clip:text;background-clip:text;color:transparent;}
  .dev{position:absolute;top:760px;left:50%;transform:translateX(-50%);width:1180px;
       filter:drop-shadow(0 60px 120px rgba(0,0,0,.6));}

  <div class="kick">Your money, clearly</div>
