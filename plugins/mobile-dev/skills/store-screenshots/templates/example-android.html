<!-- Google Play example. Render at 1080x2160 (2:1 — Play's tallest allowed ratio, which
     is closest to a phone's shape so the device fills the frame like the iPhone set does;
     1080x1920 / 16:9 also works but leaves the phone shorter). base.css is tuned for the
     1290-wide iPhone canvas, so this <style> block scales the design system down for the
     narrower/shorter Play canvas. Make the phone first:
       render_phone.py raw.png --model s21-ultra --out phone.png --width 1080 --height 2160
     then render this stage with matching --width 1080 --height 2160. -->
<style>
  .kicker{top:66px;} .kicker span{font-size:30px;padding:14px 32px;letter-spacing:5px;}
  h1{top:128px;font-size:180px;letter-spacing:-5px;}
  h2{top:376px;font-size:66px;left:50px;right:50px;}
  .phone{top:560px;width:1044px;filter:drop-shadow(0 46px 90px rgba(0,0,0,.55));}
  .badge{font-size:38px;padding:18px 30px;border-radius:22px;}
  .breakout{left:46px;right:46px;padding:44px 50px;border-radius:42px;}
  .breakout .lbl{font-size:32px;} .breakout .val{font-size:100px;margin-top:6px;}
  .breakout .pill{font-size:34px;margin-top:20px;padding:12px 26px;}
  .breakout .spark{width:240px;height:88px;right:50px;top:56px;}
</style>
<div class="stage" style="--bg-a:#0a1a44; --bg-c:#1e50d8; --accent:#34d399;">
  <div class="kicker"><span>YOUR TAGLINE</span></div>
  <h1>VERB</h1>
  <h2>THE <span class="accent">BENEFIT</span></h2>

  <div class="phone"><img src="phone-01.png"></div>

  <div class="badge" style="top:1330px; right:56px;">supporting callout</div>

  <div class="breakout" style="top:1740px;">
    <div class="lbl">Metric label</div>
    <div class="val">$12,480</div>
    <div class="pill">▲ +8.2% this week</div>
    <svg class="spark" viewBox="0 0 320 120"><polyline points="0,98 48,84 96,92 148,58 198,68 250,30 320,20"/></svg>
  </div>
</div>
